name: news-digest

# We schedule each ET time at BOTH its EDT and EST UTC hour. The guard below
# keys off WHICH cron triggered the run (github.event.schedule) -- fixed no
# matter how late GitHub actually runs it -- and uses the current DST offset
# only to pick which of the two duplicate crons is "live" today. GitHub often
# delays scheduled runs by 1-2h, so we must NOT decide by wall-clock time.
on:
  schedule:
    - cron: "0 13 * * *"   # 9AM ET when EDT (summer)
    - cron: "0 14 * * *"   # 9AM ET when EST (winter)
    - cron: "0 21 * * *"   # 5PM ET when EDT (summer)
    - cron: "0 22 * * *"   # 5PM ET when EST (winter)
  workflow_dispatch:        # manual test button
    inputs:
      slot:
        description: "Force slot for a manual test"
        type: choice
        options: [morning, afternoon]
        default: morning

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve slot from the triggering cron
        id: slot
        env:
          CRON: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.slot }}
        run: |
          # Current ET offset: -0400 = EDT (summer), -0500 = EST (winter)
          OFF=$(TZ=America/New_York date +%z)
          echo "cron='$CRON' manual='$MANUAL' et_offset=$OFF"
          if [ -n "$MANUAL" ]; then
            echo "slot=$MANUAL" >> "$GITHUB_OUTPUT"; echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$OFF" = "-0400" ]; then MORN="0 13 * * *"; AFT="0 21 * * *";   # EDT
          else                          MORN="0 14 * * *"; AFT="0 22 * * *"; fi # EST
          if [ "$CRON" = "$MORN" ]; then
            echo "slot=morning"   >> "$GITHUB_OUTPUT"; echo "run=yes" >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = "$AFT" ]; then
            echo "slot=afternoon" >> "$GITHUB_OUTPUT"; echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Cron is the other DST offset's duplicate, skipping."
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'yes'
        with:
          python-version: "3.12"

      - name: Send digest
        if: steps.slot.outputs.run == 'yes'
        env:
          DIGEST_SLOT: ${{ steps.slot.outputs.slot }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # LLM_MODEL optional: if unset, digest.py tries current free Gemini models in order.
        run: python digest.py
